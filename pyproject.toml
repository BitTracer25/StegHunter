[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "steg-hunter"
version = "2.0.0"
description = "Image steganography analysis and LSB tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "StegHunter Team", email = "info@steghunter.dev"}
]
keywords = ["steganography", "forensics", "detection", "security", "image", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.30"]
desktop = ["PySide6>=6.6", "torch>=2.0"]
training = ["pandas>=2.0", "torch>=2.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
steg-hunter = "main:main"

[tool.setuptools]
packages = ["stego"]
py-modules = ["main"]

[tool.setuptools.data-files]
"." = ["stego_model.pkl"]

[project.urls]
Homepage = "https://github.com/hackr25/StegHunter"
Repository = "https://github.com/hackr25/StegHunter.git"
Issues = "https://github.com/hackr25/StegHunter/issues"
